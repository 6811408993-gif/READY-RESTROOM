<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบนำทางและแจ้งปัญหาห้องน้ำมหาวิทยาลัย - Campus Restroom Navigator</title>

    <!-- Font & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Styles -->
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --secondary: #06b6d4;
            --accent: #f59e0b;
            --danger: #ef4444;
            --success: #10b981;
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311b92 100%);
            --card-bg: rgba(255, 255, 255, 0.95);
            --text-dark: #1e293b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Kanit', sans-serif;
        }

        body {
            background: var(--bg-gradient);
            min-height: 100vh;
            color: var(--text-dark);
            padding-bottom: 40px;
        }

        /* Navbar Header */
        header {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.4rem;
            font-weight: 700;
            color: #fff;
        }

        .logo i {
            color: var(--secondary);
            font-size: 1.8rem;
        }

        .nav-btns {
            display: flex;
            gap: 10px;
        }

        .btn-nav {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-nav:hover, .btn-nav.active {
            background: var(--secondary);
            color: #000;
            transform: translateY(-2px);
        }

        /* Container Layout */
        .container {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .page {
            display: none;
        }

        .page.active {
            display: block;
            animation: fadeIn 0.4s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Find Nearest Card */
        .hero-card {
            background: linear-gradient(135deg, #ff007a, #7928ca);
            color: white;
            border-radius: 24px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(245, 0, 87, 0.3);
            margin-bottom: 30px;
        }

        .hero-card h2 {
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .btn-gps {
            background: #fff;
            color: #d81b60;
            border: none;
            padding: 14px 28px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            margin-top: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .btn-gps:hover {
            transform: scale(1.05);
            background: #f8fafc;
        }

        /* Building Cards Grid */
        .section-title {
            color: white;
            margin-bottom: 20px;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .grid-buildings {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
        }

        .building-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
            border-top: 5px solid var(--primary);
        }

        .building-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
        }

        .building-card h3 {
            font-size: 1.4rem;
            color: #0f172a;
            margin-bottom: 8px;
        }

        .distance-badge {
            display: inline-block;
            background: #e0e7ff;
            color: var(--primary);
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 15px;
        }

        .floor-select-group {
            margin-bottom: 15px;
        }

        .floor-select-group label {
            display: block;
            font-size: 0.9rem;
            margin-bottom: 5px;
            color: #64748b;
        }

        select, input, textarea {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.2s;
        }

        select:focus, input:focus, textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.2);
        }

        .card-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .btn-action {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            text-decoration: none;
            font-size: 0.9rem;
            transition: opacity 0.2s;
        }

        .btn-map { background: #0284c7; color: white; }
        .btn-report { background: #fee2e2; color: var(--danger); }
        .btn-action:hover { opacity: 0.9; }

        /* Report Modal / Form Style */
        .modal {
            display: none;
            position: fixed;
            top:0; left:0; width:100%; height:100%;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(5px);
            z-index: 200;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: white;
            border-radius: 20px;
            padding: 30px;
            width: 90%;
            max-width: 450px;
            position: relative;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }

        .close-btn {
            position: absolute;
            top: 15px; right: 20px;
            font-size: 1.5rem;
            cursor: pointer;
            color: #94a3b8;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
        }

        .btn-submit {
            background: var(--danger);
            color: white;
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-submit:hover { background: #dc2626; }

        /* Admin Dashboard */
        .admin-card {
            background: white;
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .table-responsive {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            text-align: left;
        }

        th, td {
            padding: 12px 15px;
            border-bottom: 1px solid #e2e8f0;
        }

        th {
            background: #f8fafc;
            color: #475569;
            font-weight: 600;
        }

        .status-badge {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .status-pending { background: #fef3c7; color: #d97706; }
        .status-done { background: #d1fae5; color: #059669; }

        .btn-resolve {
            background: var(--success);
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
        }

        .btn-resolve:hover { background: #059669; }
    </style>
</head>
<body>

    <!-- Header / Navbar -->
    <header>
        <div class="logo">
            <i class="fa-solid fa-restroom"></i>
            <span>Campus Toilet Nav</span>
        </div>
        <div class="nav-btns">
            <button class="btn-nav active" onclick="switchPage('user-page', this)">
                <i class="fa-solid fa-compass"></i> ค้นหาห้องน้ำ
            </button>
            <button class="btn-nav" onclick="switchPage('admin-page', this)">
                <i class="fa-solid fa-user-shield"></i> แอดมิน
            </button>
        </div>
    </header>

    <div class="container">
        <!-- ================= PAGE USER ================= -->
        <div id="user-page" class="page active">
            <!-- Hero Nearest Search -->
            <div class="hero-card">
                <h2><i class="fa-solid fa-location-crosshairs"></i> ค้นหาห้องน้ำที่ใกล้ที่สุด</h2>
                <p>กดปุ่มด้านล่างเพื่อคำนวณหาระยะทางจากตำแหน่งปัจจุบันของคุณ</p>
                <button class="btn-gps" onclick="findNearestBuilding()">
                    <i class="fa-solid fa-location-arrow"></i> ค้นหาห้องน้ำใกล้ฉัน
                </button>
                <div id="gps-status" style="margin-top:10px; font-size:0.9rem;"></div>
            </div>

            <!-- Building Grid -->
            <h3 class="section-title"><i class="fa-solid fa-building"></i> รายการอาคารทั้งหมด</h3>
            <div class="grid-buildings" id="building-grid">
                <!-- Cards will be generated by JavaScript -->
            </div>
        </div>

        <!-- ================= PAGE ADMIN ================= -->
        <div id="admin-page" class="page">
            <div class="admin-card">
                <h2 style="color:#0f172a; margin-bottom: 10px;">
                    <i class="fa-solid fa-list-check" style="color:var(--primary);"></i> รายการการแจ้งปัญหาห้องน้ำ
                </h2>
                <p style="color:#64748b; margin-bottom: 20px;">จัดการข้อมูลปัญหากระดาษหมด ชำรุด หรือก๊อกน้ำเสียจากผู้ใช้งาน</p>

                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th>เวลา</th>
                                <th>ตึก / ชั้น</th>
                                <th>ประเภทปัญหา</th>
                                <th>รายละเอียดเพิ่มเติม</th>
                                <th>สถานะ</th>
                                <th>การจัดการ</th>
                            </tr>
                        </thead>
                        <tbody id="report-table-body">
                            <!-- Data rows will be inserted here -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Form Report Problem -->
    <div class="modal" id="reportModal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <h3 style="margin-bottom: 15px; color: var(--danger); display:flex; align-items:center; gap:8px;">
                <i class="fa-solid fa-triangle-exclamation"></i> แจ้งปัญหาห้องน้ำ
            </h3>
            <form id="reportForm" onsubmit="submitReport(event)">
                <input type="hidden" id="modalBuildingId">
                <div class="form-group">
                    <label>อาคาร</label>
                    <input type="text" id="modalBuildingName" readonly style="background:#f1f5f9;">
                </div>
                <div class="form-group">
                    <label>เลือกชั้น (1-7)</label>
                    <select id="modalFloorSelect" required></select>
                </div>
                <div class="form-group">
                    <label>ประเภทปัญหา</label>
                    <select id="modalIssueType" required>
                        <option value="">-- เลือกประเภทปัญหา --</option>
                        <option value="ห้องน้ำชำรุด">ห้องน้ำชำรุด</option>
                        <option value="กระดาษชำระหมด">กระดาษชำระหมด</option>
                        <option value="ก๊อกน้ำ / ฝักบัวเสีย">ก๊อกน้ำ / ฝักบัวเสีย</option>
                        <option value="น้ำไม่ไหล / ท่ออุดตัน">น้ำไม่ไหล / ท่ออุดตัน</option>
                        <option value="ความสะอาด">สกปรก / ต้องการการทำความสะอาด</option>
                        <option value="อื่นๆ">อื่นๆ</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>รายละเอียดเพิ่มเติม (ระบุห้องชาย/หญิง หรืออาการเพิ่มเติม)</label>
                    <textarea id="modalDetail" rows="3" placeholder="เช่น ห้องน้ำหญิง ห้องที่ 2 ก๊อกน้ำปิดไม่สนิท"></textarea>
                </div>
                <button type="submit" class="btn-submit">
                    <i class="fa-solid fa-paper-plane"></i> ส่งข้อมูลแจ้งปัญหา
                </button>
            </form>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        // ข้อมูลพิกัดตึกเรียน
        const buildings = [
            { id: 34, name: "ตึก 34", lat: 13.819279200044312, lng: 100.57869203853468 },
            { id: 29, name: "ตึก 29", lat: 13.820162252306277, lng: 100.57870233648704 },
            { id: 15, name: "ตึก 15", lat: 13.820485217498176, lng: 100.57897189849201 },
            { id: 28, name: "ตึก 28", lat: 13.820823737458843, lng: 100.57889459759403 }
        ];

        // Mockup ข้อมูลรายการแจ้งปัญหาเริ่มต้น
        let reports = [
            { id: 1, time: "10:30 น.", building: "ตึก 34", floor: "ชั้น 2", issue: "กระดาษชำระหมด", detail: "ห้องน้ำชาย", status: "pending" },
            { id: 2, time: "11:15 น.", building: "ตึก 15", floor: "ชั้น 5", issue: "ก๊อกน้ำ / ฝักบัวเสีย", detail: "ก๊อกน้ำรั่วตลอดเวลา", status: "done" }
        ];

        // Render การ์ดตึกทั้งหมด
        function renderBuildings() {
            const grid = document.getElementById('building-grid');
            grid.innerHTML = '';

            buildings.forEach(b => {
                let floorOptions = '';
                for(let i=1; i<=7; i++) {
                    floorOptions += `<option value="${i}">ชั้น ${i}</option>`;
                }

                const cardHtml = `
                    <div class="building-card" id="card-b-${b.id}">
                        <h3>${b.name}</h3>
                        <span class="distance-badge" id="dist-${b.id}">7 ชั้น (พร้อมใช้งาน)</span>
                        <div class="floor-select-group">
                            <label><i class="fa-solid fa-layer-group"></i> เลือกชั้นที่จะไป:</label>
                            <select id="select-floor-${b.id}">
                                ${floorOptions}
                            </select>
                        </div>
                        <div class="card-actions">
                            <button class="btn-action btn-map" onclick="openGoogleMap(${b.lat}, ${b.lng})">
                                <i class="fa-solid fa-location-arrow"></i> นำทาง
                            </button>
                            <button class="btn-action btn-report" onclick="openReportModal(${b.id}, '${b.name}')">
                                <i class="fa-solid fa-triangle-exclamation"></i> แจ้งปัญหา
                            </button>
                        </div>
                    </div>
                `;
                grid.innerHTML += cardHtml;
            });
        }

        // เปิด Google Maps เพื่อนำทางไปยังพิกัด
        function openGoogleMap(lat, lng) {
            const url = `https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}`;
            window.open(url, '_blank');
        }

        // คำนวณระยะทางจาก GPS (Haversine formula)
        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371e3; // รัศมีโลกเป็นเมตร
            const φ1 = lat1 * Math.PI/180;
            const φ2 = lat2 * Math.PI/180;
            const Δφ = (lat2-lat1) * Math.PI/180;
            const Δλ = (lon2-lon1) * Math.PI/180;

            const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) +
                      Math.cos(φ1) * Math.cos(φ2) *
                      Math.sin(Δλ/2) * Math.sin(Δλ/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));

            return R * c; // ระยะทางหน่วยเป็นเมตร
        }

        // ค้นหาตึกที่ใกล้ที่สุด
        function findNearestBuilding() {
            const statusDiv = document.getElementById('gps-status');
            statusDiv.innerHTML = "กำลังดึงตำแหน่ง GPS ของคุณ...";

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(position => {
                    const userLat = position.coords.latitude;
                    const userLng = position.coords.longitude;

                    let nearestBuilding = null;
                    let minDistance = Infinity;

                    buildings.forEach(b => {
                        const dist = calculateDistance(userLat, userLng, b.lat, b.lng);
                        document.getElementById(`dist-${b.id}`).innerText = `ห่างจากคุณประมาณ ${Math.round(dist)} เมตร`;
                        
                        if (dist < minDistance) {
                            minDistance = dist;
                            nearestBuilding = b;
                        }
                    });

                    statusDiv.innerHTML = `ตึกที่ใกล้คุณที่สุดคือ: <strong style="color:#ffee55; font-size:1.1rem;">${nearestBuilding.name}</strong> (${Math.round(minDistance)} เมตร)`;
                    
                    // Highlight ตึกที่ใกล้ที่สุด
                    buildings.forEach(b => {
                        document.getElementById(`card-b-${b.id}`).style.borderColor = 'transparent';
                    });
                    document.getElementById(`card-b-${nearestBuilding.id}`).style.borderColor = '#10b981';
                    document.getElementById(`card-b-${nearestBuilding.id}`).scrollIntoView({ behavior: 'smooth' });

                }, error => {
                    statusDiv.innerHTML = "<span style='color:#ff8a80;'>ไม่สามารถดึงตำแหน่ง GPS ได้ กรุณาเปิดสิทธิ์การเข้าถึงตำแหน่ง</span>";
                });
            } else {
                statusDiv.innerHTML = "เบราว์เซอร์ของคุณไม่รองรับ Geolocation";
            }
        }

        // สลับหน้า User / Admin
        function switchPage(pageId, btnElement) {
            document.querySelectorAll('.page').forEach(page => page.classList.remove('active'));
            document.querySelectorAll('.btn-nav').forEach(btn => btn.classList.remove('active'));

            document.getElementById(pageId).classList.add('active');
            btnElement.classList.add('active');

            if(pageId === 'admin-page') {
                renderAdminTable();
            }
        }

        // เปิด Modal แจ้งปัญหา
        function openReportModal(bId, bName) {
            document.getElementById('modalBuildingId').value = bId;
            document.getElementById('modalBuildingName').value = bName;

            const floorSelect = document.getElementById('modalFloorSelect');
            floorSelect.innerHTML = '';
            for(let i=1; i<=7; i++) {
                floorSelect.innerHTML += `<option value="ชั้น ${i}">ชั้น ${i}</option>`;
            }

            // เลือกชั้นปัจจุบันจากที่เลือกในหน้าหลักให้อัตโนมัติ
            const currentSelectedFloor = document.getElementById(`select-floor-${bId}`).value;
            floorSelect.value = `ชั้น ${currentSelectedFloor}`;

            document.getElementById('reportModal').style.display = 'flex';
        }

        // ปิด Modal
        function closeModal() {
            document.getElementById('reportModal').style.display = 'none';
        }

        // บันทึกการแจ้งปัญหา
        function submitReport(event) {
            event.preventDefault();

            const bName = document.getElementById('modalBuildingName').value;
            const floor = document.getElementById('modalFloorSelect').value;
            const issue = document.getElementById('modalIssueType').value;
            const detail = document.getElementById('modalDetail').value || '-';

            const now = new Date();
            const timeStr = `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')} น.`;

            reports.unshift({
                id: Date.now(),
                time: timeStr,
                building: bName,
                floor: floor,
                issue: issue,
                detail: detail,
                status: 'pending'
            });

            alert('ส่งข้อมูลแจ้งปัญหาเรียบร้อยแล้ว ขอบคุณที่ช่วยดูแลสุขอนามัยของมหาวิทยาลัยครับ');
            document.getElementById('reportForm').reset();
            closeModal();
        }

        // Render ตารางฝั่ง Admin
        function renderAdminTable() {
            const tbody = document.getElementById('report-table-body');
            tbody.innerHTML = '';

            if (reports.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;">ไม่มีการแจ้งปัญหาในขณะนี้</td></tr>';
                return;
            }

            reports.forEach(r => {
                const statusBadge = r.status === 'pending' 
                    ? `<span class="status-badge status-pending"><i class="fa-regular fa-clock"></i> รอดำเนินการ</span>` 
                    : `<span class="status-badge status-done"><i class="fa-solid fa-check"></i> แก้ไขแล้ว</span>`;

                const actionBtn = r.status === 'pending' 
                    ? `<button class="btn-resolve" onclick="resolveReport(${r.id})">ทำเครื่องหมายว่าแก้ไขแล้ว</button>` 
                    : `<span style="color:#94a3b8; font-size:0.85rem;">เสร็จสิ้น</span>`;

                const rowHtml = `
                    <tr>
                        <td>${r.time}</td>
                        <td><strong>${r.building}</strong> (${r.floor})</td>
                        <td style="color:var(--danger); font-weight:500;">${r.issue}</td>
                        <td>${r.detail}</td>
                        <td>${statusBadge}</td>
                        <td>${actionBtn}</td>
                    </tr>
                `;
                tbody.innerHTML += rowHtml;
            });
        }

        // อัปเดตสถานะปัญหาว่าได้รับการแก้ไขแล้ว
        function resolveReport(id) {
            const report = reports.find(r => r.id === id);
            if(report) {
                report.status = 'done';
                renderAdminTable();
            }
        }

        // เริ่มต้นการทำงานเมื่อโหลดหน้าเว็บ
        window.onload = function() {
            renderBuildings();
        };
    </script>
</body>
</html>
